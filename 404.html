<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Tarot Card Lady</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to Tarot Card Lady for spiritual guidance and tarot readings." />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Favicon -->
    <link rel="icon" href="wp-content/uploads/2025/05/Tarot-Card-Lady-Favicon.svg" sizes="32x32" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b69 50%, #1a0b2e 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .error-container {
            background: rgba(34, 30, 63, 0.9);
            border-radius: 20px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(204, 51, 102, 0.2);
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #CC3366;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .error-message {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #cccccc;
        }
        
        .home-button {
            display: inline-block;
            background: #CC3366;
            color: #ffffff;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .home-button:hover {
            background: #a0284d;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(204, 51, 102, 0.3);
        }
        
        .logo {
            margin-bottom: 2rem;
        }
        
        .logo img {
            max-width: 150px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo">
            <img src="wp-content/uploads/2025/05/Tarot-Card-Lady-Logo.svg" alt="Tarot Card Lady Logo" />
        </div>
        
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you're looking for seems to have vanished into the mystical realm. 
            Don't worry - even the best tarot readers sometimes need to find their way back to the right path.
        </p>
        
        <a href="/" class="home-button">Return to Home</a>
    </div>
</body>
</html>
