<script>
	(function () {
		const FORM_ACTION = 'https://development-form-relay.tanujsiripurapu.workers.dev/';

		// TODO: inject real site key at deploy time
		const siteKey = '0x4AAAAAACyGSFEmP-5tcvr2';

		let turnstileToken = '';
		let widgetId;
		let turnstileReady = false;
		let turnstileLoadFailed = false;

		function loadTurnstileScript() {
			if (window.turnstile) return Promise.resolve();
			return new Promise(function (resolve, reject) {
				var prev = window.onTurnstileLoad;
				window.onTurnstileLoad = function () {
					if (typeof prev === 'function') prev();
					resolve();
				};
				var s = document.createElement('script');
				s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';
				s.async = true;
				s.defer = true;
				s.onerror = function () {
					reject(new Error('Turnstile script failed to load'));
				};
				document.head.appendChild(s);
			});
		}

		function setBanner(type, message) {
			var errEl = document.getElementById('form-banner-error');
			var okEl = document.getElementById('form-banner-ok');
			if (!errEl || !okEl) return;
			errEl.style.display = 'none';
			okEl.style.display = 'none';
			if (type === 'error') {
				errEl.textContent = message;
				errEl.style.display = 'block';
			} else if (type === 'ok') {
				okEl.textContent = message;
				okEl.style.display = 'block';
			}
		}

		function clearFieldErrors(form) {
			var errorEls = form.querySelectorAll('.form-error');
			errorEls.forEach(function (el) {
				el.textContent = '';
			});
		}

		function setFieldError(form, name, message) {
			var el = form.querySelector('[data-error-for="' + name + '"]');
			if (el) el.textContent = message || '';
		}

		function validateAll(form) {
			clearFieldErrors(form);
			var hasError = false;
			var elements = form.querySelectorAll('input[name]:not([type="hidden"]), textarea[name]');
			elements.forEach(function (el) {
				var name = el.name;
				if (name === '_hp') return;
				var raw = (el.value || '').trim();
				if (el.hasAttribute('required') && !raw) {
					setFieldError(form, name, 'This field is required.');
					hasError = true;
				}
			});
			var email = form.elements.namedItem('email');
			if (email && email.value.trim()) {
				var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
				if (!ok) {
					setFieldError(form, 'email', 'Enter a valid email address.');
					hasError = true;
				}
			}
			return !hasError;
		}

		document.addEventListener('DOMContentLoaded', function () {
			var form = document.getElementById('contact-form');
			var submitBtn = document.getElementById('submit-btn');
			var turnstileWrapper = document.getElementById('turnstile-wrapper');

			if (!form || !submitBtn) return;

			if (siteKey && turnstileWrapper) {
				loadTurnstileScript()
					.then(function () {
						var container = document.getElementById('turnstile-container');
						if (container && window.turnstile) {
							widgetId = window.turnstile.render(container, {
								sitekey: siteKey,
								appearance: 'always',
								size: 'flexible',
								callback: function (token) {
									turnstileToken = token;
								},
								'expired-callback': function () {
									turnstileToken = '';
								},
								'error-callback': function () {
									turnstileToken = '';
									setBanner('error', 'Verification failed. Please refresh the page or try again.');
								}
							});
							turnstileWrapper.style.display = 'block';
						}
						turnstileReady = true;
					})
					.catch(function (e) {
						console.error(e);
						turnstileLoadFailed = true;
						setBanner('error', 'Verification widget could not load. Please refresh the page or call 408-912-0863.');
					});
			} else {
				turnstileReady = true;
			}

			form.addEventListener('submit', function (event) {
				setBanner('', '');
				clearFieldErrors(form);

				var hp = form.elements.namedItem('_hp');
				if (hp && hp.value) return;

				if (!validateAll(form)) return;

				if (siteKey) {
					if (!turnstileToken) {
						setBanner('error', 'Please complete the verification challenge.');
						return;
					}
					if (!turnstileReady || turnstileLoadFailed) {
						setBanner('error', 'Verification widget is not ready. Please refresh the page or call us.');
						return;
					}
				}

				// Ensure cf-turnstile-response is present as a hidden field
				if (turnstileToken) {
					var tokenField = form.querySelector('input[name="cf-turnstile-response"]');
					if (!tokenField) {
						tokenField = document.createElement('input');
						tokenField.type = 'hidden';
						tokenField.name = 'cf-turnstile-response';
						form.appendChild(tokenField);
					}
					tokenField.value = turnstileToken;
				}
				// Let the browser submit the form normally (full-page POST)
			});
		});
	})();
</script>
