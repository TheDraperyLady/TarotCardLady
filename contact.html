		.header {

		.logo {

		.main-content {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 3rem 1rem;
		}

		.contact-container {
			max-width: 1200px;
			width: 100%;
			background: rgba(27, 11, 45, 0.6);
			border-radius: 20px;
			padding: 3rem 2rem;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
			border: 1px solid rgba(155, 81, 224, 0.2);
		}

		.contact-title {
			font-size: 2.5rem;
			font-weight: bold;
			text-align: center;
			margin-bottom: 1rem;
			background: linear-gradient(135deg, #9b51e0, #0693e3);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		.contact-subtitle {
			text-align: center;
			font-size: 1.2rem;
			color: #abb8c3;
			margin-bottom: 3rem;
		}

		.contact-info {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
			gap: 2rem;
			margin-bottom: 2rem;
		}

		.contact-item {
			display: flex;
			align-items: flex-start;
			gap: 1.5rem;
			padding: 2rem;
			background: rgba(27, 11, 45, 0.8);
			border-radius: 15px;
			border: 1px solid rgba(155, 81, 224, 0.3);
			transition: transform 0.3s ease, box-shadow 0.3s ease;
			min-width: 0;
		}

		.contact-item:hover {
			transform: translateY(-5px);
			box-shadow: 0 10px 30px rgba(22, 154, 149, 0.3);
			border-color: rgba(22, 154, 149, 0.5);
		}

		.icon-wrapper {
			flex-shrink: 0;
			width: 60px;
			height: 60px;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.icon-circle {
			width: 60px;
			height: 60px;
			border-radius: 50%;
			background: #169A95;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.icon-circle svg {
			width: 30px;
			height: 30px;
		}

		.contact-details {
			flex: 1;
			min-width: 0;
		}

		.contact-label {
			font-size: 1rem;
			font-weight: 600;
			color: #abb8c3;
			margin-bottom: 0.5rem;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.contact-value {
			font-size: 1.3rem;
			font-weight: 500;
			color: #ffffff;
			word-break: break-word;
		}

		.contact-value a {
			color: #169A95;
			text-decoration: none;
			transition: color 0.3s ease;
			white-space: nowrap;
		}

		.contact-value a:hover {
			color: #1DDDBF;
			text-decoration: underline;
		}

		.back-link {
			text-align: center;
			margin-top: 2rem;
		}

		.back-button {
			display: inline-block;
			padding: 0.75rem 2rem;
			background: linear-gradient(135deg, #9b51e0, #0693e3);
			color: #ffffff;
			text-decoration: none;
			border-radius: 30px;
			font-weight: 600;
			transition: transform 0.3s ease, box-shadow 0.3s ease;
			border: none;
			cursor: pointer;
		}

		.back-button:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 25px rgba(155, 81, 224, 0.4);
		}

		@media (max-width: 768px) {
			.contact-title {
				font-size: 2rem;
			}

			.contact-info {
				grid-template-columns: 1fr;
				gap: 1.5rem;

			.contact-container {

			}

			.contact-item {
				padding: 1.5rem;
			}

			.contact-value {
				font-size: 0.95rem;
			}

			.contact-value a {
				white-space: nowrap;
			}
		}

		@media (max-width: 480px) {

			}
